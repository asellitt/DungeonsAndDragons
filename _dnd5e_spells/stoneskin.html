---
---
<div class="card-wrapper">
    <div class="card">
        <div class="name">
            <div class="content">Stoneskin</div>
        </div>
        <div class="spell-level">
            <div class="content">4th-level Transmutation</div>
        </div>
        <div class="casting-time">
            <div class="header">Casting Time</div>
            <div class="content">1 action</div>
        </div>
        <div class="range">
            <div class="header">Range</div>
            <div class="content">Touch</div>
        </div>
        <div class="components">
            <div class="header">Components</div>
            <div class="content">V, S, M</div>
        </div>
        <div class="duration">
            <div class="header">Duration</div>
            <div class="content">1 hour</div>
            <div class="concentration"><div>C</div></div>
        </div>
        <div class="description long-description">
            <p>
                <i>
                    Material: diamond dust worth 100GP, which the spell
                    consumes.
                </i>
            </p>
            <p>
                Until the spell ends, one willing creature you touch has
                Resistance to Bludgeoning, Piercing, and Slashing damage.
            </p>
        </div>
        <div class="class-label"></div>
    </div>
</div>
