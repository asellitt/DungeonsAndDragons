<div class="card-wrapper">
    <div class="card">
        <div class="name">
            <div class="content">Blur</div>
        </div>
        <div class="spell-level">
            <div class="content">2nd-level Illusion</div>
        </div>
        <div class="casting-time">
            <div class="header">Casting Time</div>
            <div class="content">1 action</div>
        </div>
        <div class="range">
            <div class="header">Range</div>
            <div class="content">Self</div>
        </div>
        <div class="components">
            <div class="header">Components</div>
            <div class="content">V</div>
        </div>
        <div class="duration">
            <div class="header">Duration</div>
            <div class="content">1 minute</div>
            <div class="concentration"><div>C</div></div>
        </div>
        <div class="description long-description">
            <p>
                Your body becomes blurred. For the duration, any creature has
                Disadvantage on attack rolls against you. An attacker is immune
                to this effect if it perceives you with Blindsight or Truesight.
            </p>
        </div>
        <div class="class-label"></div>
    </div>
</div>
