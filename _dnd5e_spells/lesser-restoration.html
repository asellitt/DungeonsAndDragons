---
<div class="card-wrapper">
    <div class="card">
        <div class="name">
            <div class="content">Lesser Restoration</div>
        </div>
        <div class="spell-level">
            <div class="content">2nd-level Restoration</div>
        </div>
        <div class="casting-time">
            <div class="header">Casting Time</div>
            <div class="content">1 bonus action</div>
        </div>
        <div class="range">
            <div class="header">Range</div>
            <div class="content">Touch</div>
        </div>
        <div class="components">
            <div class="header">Components</div>
            <div class="content">V, S</div>
        </div>
        <div class="duration">
            <div class="header">Duration</div>
            <div class="content">Instantaneous</div>
        </div>
        <div class="description long-description">
            <p>
                You touch a creature and end one condition on it: Blinded,
                Deafened, Paralyzed, or Poisoned.
            </p>
        </div>
        <div class="class-label"></div>
    </div>
</div>
