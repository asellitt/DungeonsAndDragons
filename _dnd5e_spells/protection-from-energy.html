---
<div class="card-wrapper">
    <div class="card">
        <div class="name">
            <div class="content">Protection From Energy</div>
        </div>
        <div class="spell-level">
            <div class="content">3rd-level Abjuration</div>
        </div>
        <div class="casting-time">
            <div class="header">Casting Time</div>
            <div class="content">1 action</div>
        </div>
        <div class="range">
            <div class="header">Range</div>
            <div class="content">Touch</div>
        </div>
        <div class="components">
            <div class="header">Components</div>
            <div class="content">V, S</div>
        </div>
        <div class="duration">
            <div class="header">Duration</div>
            <div class="content">1 hour</div>
            <div class="concentration"><div>C</div></div>
        </div>
        <div class="description long-description">
            <p>
                For the duration, the willing creature you touch has Resistance
                to one damage type of your choice: Acid, Cold, Fire, Lightning,
                or Thunder.
            </p>
        </div>
        <div class="class-label"></div>
    </div>
</div>
