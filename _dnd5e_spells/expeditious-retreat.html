---
<div class="card-wrapper">
    <div class="card">
        <div class="name">
            <div class="content">Expeditious Retreat</div>
        </div>
        <div class="spell-level">
            <div class="content">1st-level Transmutation</div>
        </div>
        <div class="casting-time">
            <div class="header">Casting Time</div>
            <div class="content">1 bonus action</div>
        </div>
        <div class="range">
            <div class="header">Range</div>
            <div class="content">Self</div>
        </div>
        <div class="components">
            <div class="header">Components</div>
            <div class="content">V,S</div>
        </div>
        <div class="duration">
            <div class="header">Duration</div>
            <div class="content">10 minute</div>
            <div class="concentration"><div>C</div></div>
        </div>
        <div class="description long-description">
            <p>
                You take the Dash action, and until the spell ends, you can take
                that action again as a Bonus Action.
            </p>
        </div>
        <div class="class-label"></div>
    </div>
</div>
