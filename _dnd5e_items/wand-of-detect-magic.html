<div class="card-wrapper">
    <div class="card uncommon">
        <div class="name">
            <div class="content">Wand Of Detect Magic</div>
        </div>
        <div class="type">
            <div class="content">Wand</div>
        </div>
        <div class="weight">
            <div class="header">Weight</div>
            <div class="content">0</div>
        </div>
        <div class="proficiency">
            <div class="header">Proficiency</div>
            <div class="content">&mdash;</div>
        </div>
        <div class="description short-description">
            <p>
                This wand has 3 charges. While holding it, you can expend 1
                charge to cast Detect Magic from it.
            </p>
        </div>
        <div class="recharge">
            <div class="content">Recharge</div>
        </div>
        <div class="timing">
            The wand regains 1d3 expended charges daily at dawn.
        </div>
    </div>
</div>
