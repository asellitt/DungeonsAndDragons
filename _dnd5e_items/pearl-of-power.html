<div class="card-wrapper">
    <div class="card uncommon">
        <div class="name">
            <div class="content">Pearl of Power</div>
        </div>
        <div class="type">
            <div class="content">Wondrous Item</div>
        </div>
        <div class="weight">
            <div class="header">Weight</div>
            <div class="content">0</div>
        </div>
        <div class="proficiency">
            <div class="header">Proficiency</div>
            <div class="content">Spellcaster</div>
            <div class="attunement"><div>A</div></div>
        </div>
        <div class="description short-description">
            <p>
                While this pearl is on your person, you can take a Magic action
                to regain one expended spell slot of level 3 or lower.
            </p>
        </div>
        <div class="recharge">
            <div class="content">Recharge</div>
        </div>
        <div class="timing">
            Once used, this property can't be used again until the next dawn.
        </div>
    </div>
</div>
