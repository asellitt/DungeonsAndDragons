            Open Sans Condensed,

        font-weight: 400;
        font-size: 3mm;
        color: #111;
        text-align: center;
        overflow: hidden;
        background-color: #000;

    .name {
        background-color: #fff;
        position: absolute;
        top: 3mm;
        left: 3mm;
        width: 57mm;
        height: 5mm;
        border-radius: 2mm 2mm 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .name .content {
        font-size: 3.5mm;
        text-transform: uppercase;
        font-weight: bold;
    }
    .spell-level {
        position: absolute;
        top: 8mm;
        width: 100%;
        height: 3mm;
    }
    .spell-level .content {
        color: #fff;
        font-size: 2mm;
        line-height: 3mm;
    }
    .casting-time,
    .range {
        background-color: #fff;
        display: inline-block;
        position: absolute;
        top: 11mm;
        width: 28.25mm;
        height: 8mm;
    }
    .casting-time {
        left: 3mm;
    }
    .range {
        left: 31.75mm;
    }
    .components,
    .duration {
        background-color: #fff;
        display: inline-block;
        position: absolute;
        top: 19.5mm;
        width: 28.25mm;
        height: 8mm;
    }
    .components {
        left: 3mm;
    }
    .duration {
        left: 31.75mm;
    }
    .concentration {
        width: 0;
        height: 0;
        border: 3mm solid transparent;
        position: relative;
        top: -9mm;
        left: 22mm;
        font-weight: bold;
        color: #fff;
        border-bottom-color: #000;
    }
    .concentration:after {
        content: "";
        position: absolute;
        left: -3mm;
        top: 3mm;
        width: 0;
        height: 0;
        border: 3mm solid transparent;
        border-top-color: #000;
    }
    .concentration div {
        position: absolute;
        top: 1.1mm;
        left: -1.1mm;
        z-index: 100;
    }
    .header {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 3mm;
        color: #000;
    }
    .description {
        background-color: #fff;
        display: inline-block;
        position: absolute;
        top: 30.5mm;
        left: 3mm;
        width: 55mm;
        height: 34mm;
        padding: 1mm;
        text-align: justify;
        font-size: 2mm;
    }
    .description p {
        margin: 0;
        padding-left: 0;
        border: 0;
        padding-bottom: 1mm;
    }
    .description ul {
        margin: 0;
        padding-left: 3mm;
        border: 0;
        padding-bottom: 1mm;
    }
    .short-description {
        height: 38mm;
    }
    .long-description {
        height: 51mm;
        border-radius: 0 0 2mm 2mm;
    }
    .higher-levels {
        display: inline-block;
        position: absolute;
        top: 70.5mm;
        left: 0mm;
        height: 3mm;
        width: 100%;

    .higher-levels .content {

<div class="class-picker">
    <select id="class-picker">
        <option value="">Default</option>
        <optgroup label="Class">
            <option value="class-artificer">Artificer</option>
            <option value="class-barbarian">Barbarian</option>
            <option value="class-bard">Bard</option>
            <option value="class-cleric">Cleric</option>
            <option value="class-druid">Druid</option>
            <option value="class-fighter">Fighter</option>
            <option value="class-monk">Monk</option>
            <option value="class-paladin">Paladin</option>
            <option value="class-ranger">Ranger</option>
            <option value="class-rogue">Rogue</option>
            <option value="class-sorcerer">Sorcerer</option>
            <option value="class-warlock">Warlock</option>
            <option value="class-wizard">Wizard</option>
        </optgroup>
        <optgroup label="Gale Force Nine">
            <option value="gf9-arcane">Arcane</option>
            <option value="gf9-bard">Bard</option>
            <option value="gf9-cleric">Cleric</option>
            <option value="gf9-druid">Druid</option>
            <option value="gf9-paladin">Paladin</option>
            <option value="gf9-ranger">Ranger</option>
        </optgroup>
        <optgroup label="Character">
            <option value="char-rulke">Rulke</option>
        </optgroup>
    </select>

    <button id="select-all">Select All</button>
    <button id="deselect-all">Deselect All</button>
</div>

{% for spell in site.dnd5e_spells %}
    {{ spell.content }}
{% endfor %}

<script>
    document.getElementById("class-picker").addEventListener("change", (e) => {
        const classname = e.target.value;
        Array.from(document.getElementsByClassName("card")).forEach(
            function (element) {
                element.className = "card " + classname;
            },
        );
    });
    document.querySelectorAll(".card-wrapper").forEach((element) =>
        element.addEventListener("click", (_) => {
            if (element.classList.contains("no-print")) {
                element.classList.remove("no-print");
            } else {
                element.classList.add("no-print");
            }
        }),
    );
    document.getElementById("select-all").addEventListener("click", (_) => {
        document
            .querySelectorAll(".card-wrapper")
            .forEach((element) => element.classList.remove("no-print"));
    });
    document.getElementById("deselect-all").addEventListener("click", (_) => {
        document
            .querySelectorAll(".card-wrapper")
            .forEach((element) => element.classList.add("no-print"));
    });
</script>
